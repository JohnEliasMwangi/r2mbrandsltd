<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Wrapper Demo - R2M Brands</title>
<link rel="stylesheet" href="assets/css/styles.css">
<style>
body{display:grid;place-items:center;min-height:100vh;padding:40px}
.demo-grid{display:grid;gap:48px;max-width:900px;width:100%}
</style>
</head>
<body>
<div class="demo-grid">
  <div class="neon-wrapper">
    <div class="card neon-inner" style="padding:32px">
      <h2 style="margin:0 0 12px">Neon Wrapper - Cyan to Blue</h2>
      <p style="color:var(--ink-2)">Vibrant cyan-to-blue gradient ring-light with breathing pulseGlow animation.</p>
      <div style="margin-top:18px;display:flex;gap:12px">
        <span class="eyebrow"><span class="dot"></span> Breathing LED</span>
      </div>
    </div>
  </div>

  <div class="neon-wrapper">
    <form class="card neon-inner" style="padding:28px;display:grid;gap:16px">
      <h3 style="margin:0">Contact Form - Neon Framed</h3>
      <div class="field"><label>Name</label><input placeholder="John Doe"></div>
      <div class="field"><label>Email</label><input placeholder="john@brand.com"></div>
      <div class="field"><label>Message</label><textarea placeholder="Tell us about your brand..."></textarea></div>
      <button class="btn btn-primary" type="button">Send Message</button>
    </form>
  </div>
</div>
</body>
</html>
